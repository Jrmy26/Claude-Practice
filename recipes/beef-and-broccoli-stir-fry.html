<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Beef and Broccoli Stir Fry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a kitchen prep sheet. Servings control stays pinned; ingredients beside numbered steps. */
:root {
  --bg: #faf9f5; --surface: #ffffff; --fg: #1f1e1d; --muted: #6b6a63;
  --line: #e3e1d7; --accent: #1f1e1d; --accent-fg: #faf9f5; --tint: #f0eee6;
  --display: "Source Serif 4", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --surface: #30302e; --fg: #f5f4ee; --muted: #b7b5a9;
    --line: #45443f; --accent: #f5f4ee; --accent-fg: #262624; --tint: #3a3a37;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302e; --fg: #f5f4ee; --muted: #b7b5a9;
  --line: #45443f; --accent: #f5f4ee; --accent-fg: #262624; --tint: #3a3a37;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 17px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 28px 18px; display: grid; gap: 6px; }
h1 { margin: 0; font: 500 clamp(32px, 6vw, 46px)/1.12 var(--display); text-wrap: balance; }
h2 { margin: 0; font: 500 24px/1.25 var(--display); }
h3 { margin: 0; font: 600 14px/1.3 var(--body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.summary { margin: 0; max-width: 65ch; }
.meta { margin: 0; color: var(--muted); font-size: 15px; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-block: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding-block: 10px; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper label { font-weight: 600; }
.stepper button, #servings { height: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 22px var(--body); border-radius: 6px; }
.stepper button { width: 44px; cursor: pointer; }
.stepper button:hover { background: var(--tint); }
#servings { width: 68px; text-align: center; font-variant-numeric: tabular-nums; }
.macros { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; font-variant-numeric: tabular-nums; }
.macros div { display: flex; align-items: baseline; gap: 5px; }
.macros dt { color: var(--muted); font-size: 14px; }
.macros dd { margin: 0; font: 600 21px var(--display); }
.macros .per { color: var(--muted); font-size: 14px; align-self: center; }
.note { margin: 14px 0 0; padding: 10px 14px; background: var(--tint); border-radius: 6px; font-size: 16px; }
main { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 36px; padding-block: 24px 48px; }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
section { display: grid; gap: 12px; align-content: start; min-width: 0; }
.column { display: grid; gap: 32px; align-content: start; min-width: 0; }
ul.ing { list-style: none; margin: 0 0 8px; padding: 0; }
ul.ing li { display: grid; grid-template-columns: minmax(104px, 34%) minmax(0, 1fr); gap: 12px; padding-block: 6px; border-bottom: 1px solid var(--line); }
.qty { font-weight: 600; font-variant-numeric: tabular-nums; }
.qty small { display: block; font-weight: 400; font-size: 14px; color: var(--muted); }
ol.steps { margin: 0; padding-left: 26px; display: grid; gap: 12px; max-width: 65ch; }
ol.steps li::marker { font: 600 18px var(--display); color: var(--accent); }
.mfp-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#copy { min-height: 44px; padding: 0 18px; border: 0; border-radius: 6px; background: var(--accent); color: var(--accent-fg); font: 600 16px var(--body); cursor: pointer; }
pre { margin: 0; padding: 14px; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font: 400 14px/1.6 var(--mono); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>

<header class="wrap">
  <h1 id="name"></h1>
  <p class="summary" id="summary"></p>
  <p class="meta" id="meta"></p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="stepper">
      <label for="servings">Servings</label>
      <button type="button" id="minus" aria-label="Remove a serving">&minus;</button>
      <input id="servings" type="number" min="1" max="24" step="1" inputmode="numeric">
      <button type="button" id="plus" aria-label="Add a serving">+</button>
    </div>
    <dl class="macros" id="macros"></dl>
  </div>
</div>

<div class="wrap">
  <p class="note" id="scale-note" hidden></p>
  <main>
    <div class="column">
      <section aria-labelledby="ing-h">
        <h2 id="ing-h">Ingredients</h2>
        <div id="ingredients"></div>
      </section>
      <section aria-labelledby="mfp-h">
        <div class="mfp-head">
          <h2 id="mfp-h">MyFitnessPal list</h2>
          <button type="button" id="copy">Copy list</button>
        </div>
        <pre id="mfp" tabindex="0"></pre>
      </section>
    </div>
    <section aria-labelledby="steps-h">
      <h2 id="steps-h">Steps</h2>
      <ol class="steps" id="steps"></ol>
    </section>
  </main>
</div>

<script>
// Recipe data. To make a page for another recipe, replace this object and the <title> above.
// us types: "lb" (n in pounds), "tsp" (n in teaspoons, shown as tsp, Tbsp or cups), "count" (n items).
// Steps must not state quantities. They can use {name} placeholders filled by vars(servings).
const RECIPE = {
  name: "Beef and Broccoli Stir Fry",
  summary: "A big portion of lean beef, kept tender by a short baking soda marinade, with oil-free steamed broccoli that stays crisp through a few days of meal prep.",
  baseServings: 4,
  meta: "Prep 25 min. Cook 20 min. Dairy-free, egg-free. Contains soy, wheat, sesame and shellfish (oyster sauce).",
  macros: { kcal: 490, protein: 51, carbs: 20, fat: 22 },
  ingredients: [
    { group: "Main", items: [
      { qty: 850, unit: "g", us: { n: 1.875, type: "lb" }, name: "flank steak" },
      { qty: 570, unit: "g", us: { n: 1.25, type: "lb" }, name: "broccoli crowns, cut into 1 1/2-inch (4 cm) florets" }
    ]},
    { group: "Marinade", items: [
      { qty: 3.5, unit: "g", us: { n: 0.75, type: "tsp" }, name: "baking soda" },
      { qty: 15, unit: "mL", us: { n: 3, type: "tsp" }, name: "low-sodium soy sauce" },
      { qty: 15, unit: "mL", us: { n: 3, type: "tsp" }, name: "Shaoxing wine" },
      { qty: 8, unit: "g", us: { n: 3, type: "tsp" }, name: "cornstarch" }
    ]},
    { group: "Sauce", items: [
      { qty: 160, unit: "mL", us: { n: 32, type: "tsp" }, name: "low-sodium beef broth" },
      { qty: 45, unit: "mL", us: { n: 9, type: "tsp" }, name: "oyster sauce" },
      { qty: 30, unit: "mL", us: { n: 6, type: "tsp" }, name: "low-sodium soy sauce" },
      { qty: 15, unit: "mL", us: { n: 3, type: "tsp" }, name: "Shaoxing wine" },
      { qty: 15, unit: "mL", us: { n: 3, type: "tsp" }, name: "unseasoned rice vinegar" },
      { qty: 9, unit: "g", us: { n: 2, type: "tsp" }, name: "packed brown sugar" },
      { qty: 8, unit: "g", us: { n: 3, type: "tsp" }, name: "cornstarch" },
      { qty: 5, unit: "mL", us: { n: 1, type: "tsp" }, name: "toasted sesame oil" },
      { qty: 0.5, unit: "g", us: { n: 0.25, type: "tsp" }, name: "ground white or black pepper" }
    ]},
    { group: "Cooking", items: [
      { qty: 80, unit: "mL", us: { n: 16, type: "tsp" }, name: "water, for steaming the broccoli" },
      { qty: 20, unit: "mL", us: { n: 4, type: "tsp" }, name: "canola or avocado oil, divided" }
    ]},
    { group: "Aromatics", items: [
      { qty: 12, unit: "g", us: { n: 4, type: "count", one: "clove", many: "cloves" }, name: "garlic, minced" },
      { qty: 6, unit: "g", us: { n: 3, type: "tsp" }, name: "grated fresh ginger" },
      { qty: 0.5, unit: "g", us: { n: 0.25, type: "tsp" }, name: "red pepper flakes" }
    ]},
    { group: "To finish", items: [
      { qty: 30, unit: "g", us: { n: 2, type: "count", one: "scallion", many: "scallions" }, name: "thinly sliced" },
      { qty: 3, unit: "g", us: { n: 1, type: "tsp" }, name: "toasted sesame seeds" }
    ]}
  ],
  mfp: [
    { qty: 850, unit: "g", name: "flank steak, raw" },
    { qty: 3.5, unit: "g", name: "baking soda" },
    { qty: 45, unit: "mL", name: "low-sodium soy sauce" },
    { qty: 30, unit: "mL", name: "Shaoxing wine" },
    { qty: 16, unit: "g", name: "cornstarch" },
    { qty: 160, unit: "mL", name: "low-sodium beef broth" },
    { qty: 45, unit: "mL", name: "oyster sauce" },
    { qty: 15, unit: "mL", name: "unseasoned rice vinegar" },
    { qty: 9, unit: "g", name: "brown sugar" },
    { qty: 5, unit: "mL", name: "toasted sesame oil" },
    { qty: 0.5, unit: "g", name: "ground black pepper" },
    { qty: 570, unit: "g", name: "broccoli crowns, raw" },
    { qty: 20, unit: "mL", name: "canola oil" },
    { qty: 12, unit: "g", name: "garlic, raw" },
    { qty: 6, unit: "g", name: "ginger root, raw" },
    { qty: 0.5, unit: "g", name: "red pepper flakes" },
    { qty: 30, unit: "g", name: "scallions, raw" },
    { qty: 3, unit: "g", name: "toasted sesame seeds" }
  ],
  vars: function (s) {
    const n = Math.ceil((850 / 4) * s / 285);
    return {
      batches: n === 1 ? "1 batch" : n + " batches",
      containers: s === 1 ? "1 container" : s + " containers"
    };
  },
  scaleNote: {
    above: 4,
    text: "Above 4 servings, one pan gets crowded. Steam the broccoli in batches, and finish the stir fry in two batches with the sauce split between them. Allow extra cooking time for the added beef batches."
  },
  steps: [
    "Slice the steak across the grain into strips 1/8 to 1/4 inch (3 to 6 mm) thick and about 2 inches (5 cm) long, until the long muscle fibers show as short lines across each strip.",
    "Toss the beef with the baking soda and the marinade soy sauce, Shaoxing wine and cornstarch for 30 seconds, until no dry cornstarch remains.",
    "Let the beef stand at room temperature for 15 minutes, until the surface looks slightly tacky; the baking soda raises the meat's pH so it stays tender over high heat.",
    "Whisk all the sauce ingredients for 20 seconds, until no lumps remain.",
    "Heat the dry wok over high heat for 1 minute, until a drop of water evaporates on contact.",
    "Add the broccoli and water and cover the pan for 2 to 3 minutes, until the broccoli is bright green and a knife slides into a stem with slight resistance; it softens more when reheated, so stop while it is still firm.",
    "Transfer the broccoli to a large plate, then wipe the pan dry with a thick wad of paper towels held in tongs.",
    "Divide the beef into {batches}. Set aside about a quarter of the oil for the aromatics and share out the rest, one portion per batch.",
    "Heat one portion of oil in the pan over high heat for 1 minute, until it just begins to smoke.",
    "Spread one batch of beef in a single layer and sear without moving it for 60 to 90 seconds, until the undersides are well browned.",
    "Stir-fry the beef for 30 to 60 seconds, until no pink shows on the outside, then transfer it to a clean plate. Repeat the last two steps and this one for any remaining batches.",
    "Reduce the heat to medium and add the reserved oil, the garlic, ginger and red pepper flakes, stirring for 30 seconds, until fragrant and the garlic is just pale gold at the edges.",
    "Rewhisk the sauce, pour it into the pan and simmer for 1 to 2 minutes, stirring, until glossy and thick enough to coat a spoon.",
    "Return the beef, broccoli and any plate juices to the pan and toss for 1 minute, until everything is coated and the beef reaches 145°F (63°C), measured by sliding the thermometer sideways into the thickest strip or a folded stack of strips.",
    "Remove the pan from the heat and let it rest for 3 minutes, until the sauce clings to the beef; the rest completes the USDA safe-cooking guideline for whole cuts of beef.",
    "Divide the stir fry among {containers} and top with the scallions and sesame seeds."
  ]
};

// Page logic. No changes are needed here for a new recipe.
const $ = function (id) { return document.getElementById(id); };
const FRACTIONS = [[0, ""], [0.125, "1/8"], [0.25, "1/4"], [1 / 3, "1/3"], [0.5, "1/2"], [2 / 3, "2/3"], [0.75, "3/4"], [1, ""]];

function fraction(x) {
  let whole = Math.floor(x);
  const rest = x - whole;
  let best = FRACTIONS[0];
  FRACTIONS.forEach(function (f) { if (Math.abs(f[0] - rest) < Math.abs(best[0] - rest)) best = f; });
  if (best[0] === 1) { whole += 1; best = FRACTIONS[0]; }
  if (whole === 0 && best[0] === 0) return "1/8";
  return [whole || "", best[1]].filter(Boolean).join(" ");
}

function volume(tsp) {
  if (tsp >= 12) {
    const cups = tsp / 48;
    return fraction(cups) + (cups > 1.1 ? " cups" : " cup");
  }
  if (tsp >= 3) return fraction(Math.round(tsp / 3 * 2) / 2) + " Tbsp";
  return fraction(tsp) + " tsp";
}

function weight(lb) {
  const oz = Math.round(lb * 16);
  if (oz < 16) return oz + " oz";
  const rest = oz % 16;
  return Math.floor(oz / 16) + " lb" + (rest ? " " + rest + " oz" : "");
}

function usAmount(us, f) {
  const n = us.n * f;
  if (us.type === "lb") return weight(n);
  if (us.type === "tsp") return volume(n);
  const rounded = Math.max(0.5, Math.round(n * 2) / 2);
  return fraction(rounded) + " " + (rounded > 1 ? us.many : us.one);
}

function metric(q) {
  if (q < 1) return String(Math.max(0.1, Math.round(q * 10) / 10));
  if (q < 10) return String(Math.round(q * 2) / 2);
  return String(Math.round(q));
}

function clamp(value) {
  return Math.min(24, Math.max(1, Math.round(value)));
}

function renderStatic() {
  $("name").textContent = RECIPE.name;
  $("summary").textContent = RECIPE.summary;
  $("meta").textContent = RECIPE.meta;
}

function render(servings) {
  const f = servings / RECIPE.baseServings;
  const m = RECIPE.macros;

  $("macros").replaceChildren();
  [["kcal", m.kcal], ["protein", m.protein + " g"], ["carbs", m.carbs + " g"], ["fat", m.fat + " g"]].forEach(function (row) {
    const box = document.createElement("div");
    const dd = document.createElement("dd");
    const dt = document.createElement("dt");
    dd.textContent = row[1];
    dt.textContent = row[0];
    box.append(dd, dt);
    $("macros").append(box);
  });
  const per = document.createElement("div");
  per.className = "per";
  per.textContent = "estimated, per serving";
  $("macros").append(per);

  $("ingredients").replaceChildren();
  RECIPE.ingredients.forEach(function (group) {
    const h = document.createElement("h3");
    h.textContent = group.group;
    const ul = document.createElement("ul");
    ul.className = "ing";
    group.items.forEach(function (item) {
      const li = document.createElement("li");
      const qty = document.createElement("span");
      qty.className = "qty";
      qty.textContent = usAmount(item.us, f);
      const small = document.createElement("small");
      small.textContent = metric(item.qty * f) + " " + item.unit;
      qty.append(small);
      const name = document.createElement("span");
      name.textContent = item.name;
      li.append(qty, name);
      ul.append(li);
    });
    $("ingredients").append(h, ul);
  });

  const vars = RECIPE.vars(servings);
  $("steps").replaceChildren();
  RECIPE.steps.forEach(function (step) {
    const li = document.createElement("li");
    li.textContent = step.replace(/\{(\w+)\}/g, function (_, key) { return vars[key]; });
    $("steps").append(li);
  });

  $("mfp").textContent = ["Servings: " + servings].concat(RECIPE.mfp.map(function (row) {
    return metric(row.qty * f) + " " + row.unit + " " + row.name;
  })).join("\n");

  const note = RECIPE.scaleNote;
  $("scale-note").hidden = !note || servings <= note.above;
  if (note) $("scale-note").textContent = note.text;
}

function setServings(value) {
  const servings = clamp(value);
  $("servings").value = servings;
  render(servings);
}

$("minus").addEventListener("click", function () { setServings(Number($("servings").value) - 1); });
$("plus").addEventListener("click", function () { setServings(Number($("servings").value) + 1); });
$("servings").addEventListener("input", function () {
  const value = Number(this.value);
  if (this.value !== "" && value >= 1 && value <= 24) render(Math.round(value));
});
$("servings").addEventListener("blur", function () {
  setServings(Number(this.value) || RECIPE.baseServings);
});

$("copy").addEventListener("click", function () {
  const button = this;
  function done(label) {
    button.textContent = label;
    setTimeout(function () { button.textContent = "Copy list"; }, 1800);
  }
  function selectList() {
    const range = document.createRange();
    range.selectNodeContents($("mfp"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    done("Press Ctrl+C");
  }
  if (!navigator.clipboard) { selectList(); return; }
  navigator.clipboard.writeText($("mfp").textContent).then(function () { done("Copied"); }, selectList);
});

renderStatic();
setServings(RECIPE.baseServings);
</script>
